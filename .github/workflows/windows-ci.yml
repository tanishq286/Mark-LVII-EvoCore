name: J.A.R.V.I.S Windows CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Windows / Python 3.13 regression
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      JARVIS_DISABLE_247_AGENTS: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pytest>=8,<10"

      - name: Run repository regression suite
        run: python -B -m pytest -q

      - name: Run provider contract and streaming tests
        run: python -B -m providers._tests

      - name: Validate all distributable plugins
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pluginFiles = Get-ChildItem -Path "plugins" -Filter "*.py" -File |
            Where-Object { -not $_.Name.StartsWith("_") }
          $failed = @()
          foreach ($plugin in $pluginFiles) {
            Write-Host "Validating $($plugin.Name)"
            python scripts/validate_plugin.py $plugin.FullName --repo-root "." --json
            if ($LASTEXITCODE -ne 0) {
              $failed += $plugin.Name
            }
          }
          if ($failed.Count -gt 0) {
            throw "Plugin validation failed: $($failed -join ', ')"
          }
          Write-Host "Validated $($pluginFiles.Count) plugin files successfully."
